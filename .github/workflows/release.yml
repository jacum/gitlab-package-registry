name: Release to Sonatype

on:
  workflow_dispatch:

permissions:
  contents: write  # sbt-release will create tags and push commits

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      # Passphrase for signing (sbt-pgp reads this)
      PGP_PASSPHRASE: ${{ secrets.GPG_PASS }}

    steps:
      - name: Checkout
      # sbt-release needs tags and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Ivy and Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**.sbt', '**/project/**.scala') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Import GPG private key
        shell: bash
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          printf "%s" "${GPG_SECRET}" | gpg --batch --import
          # reload agent to pick up allow-loopback-pinentry
          gpgconf --kill gpg-agent || true
        env:
          GPG_SECRET: ${{ secrets.GPG_SECRET }}

      - name: Configure Git identity for release
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "GitHub Actions Release Bot"

      - name: Compile
        run: sbt compile

      - name: Release to Sonatype (bundle + upload + release)
        # not via sbt-release: it insists on a -SNAPSHOT current version.
        # sonatypeCentralRelease uploads the bundle AND publishes it
        # (do not combine with sonatypeCentralUpload - they are alternatives)
        run: sbt clean sonatypeBundleClean publishSigned sonatypeCentralRelease
